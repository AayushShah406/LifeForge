[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeforge-api"
version = "0.1.0"
description = "LifeForge - Turn goals into verified actions. Agentic personal operations platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "weaviate-client>=4.7.1",
    "langchain>=0.2.14",
    "langchain-core>=0.2.35",
    "langgraph>=0.2.16",
    "langsmith>=0.1.100",
    "google-generativeai>=0.8.0",
    "langchain-google-genai>=1.0.8",
    "pymupdf>=1.24.9",
    "python-docx>=1.1.2",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
